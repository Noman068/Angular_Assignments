<div class="contact-list-container">
  <!-- Filter Buttons -->
  <div class="filter-buttons">
    @for (filter of filters; track filter) {
      <button 
        [class.active]="isFilterActive(filter)"
        (click)="onFilterClick(filter)"
        class="filter-btn">
        {{ filter }}
      </button>
    }
  </div>

  <!-- Contact List -->
  <div class="contacts-container">
    @for (contact of contacts; track contact.id) {
      <div 
        [class.selected]="isContactSelected(contact)"
        (click)="onContactClick(contact)"
        class="contact-card">
      
      <div class="contact-header">
        <h3 class="contact-name" [innerHTML]="contact.name | highlight:searchTerm"></h3>
        <div class="contact-badges">
          @if (contact.groups.includes('Favourites')) {
            <span class="badge favourite">
              ⭐
            </span>
          }
          @for (group of getGroupBadges(contact); track group) {
            <span class="badge group">
              {{ group }}
            </span>
          }
        </div>
      </div>
      
      <div class="contact-info">
        <p class="contact-phone">📞 {{ contact.phone }}</p>
        <p class="contact-email">📧 {{ contact.email }}</p>
      </div>
      
      <div class="contact-footer">
        <span class="contact-gender">{{ contact.gender }}</span>
      </div>
    </div>
  }
  </div>
</div>
